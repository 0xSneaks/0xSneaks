<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Now building: Pump Deck, pfbsfilter, Muse Park">
<defs>
<linearGradient id="e" x1="0" x2="1"><stop offset="0" stop-color="#ff3ea5"/><stop offset=".5" stop-color="#b48cff"/><stop offset="1" stop-color="#2ed3ff"/></linearGradient>
<pattern id="sc" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".04"/></pattern>
<clipPath id="c"><rect x="2" y="2" width="996" height="296" rx="13"/></clipPath>
</defs>
<style>
.h{font:900 30px 'Arial Black',Impact,'Helvetica Neue',sans-serif;letter-spacing:3px;fill:#f4f4f8}
.hp{fill:#ff3ea5;animation:jp 2.6s steps(1) infinite}.hq{fill:#2ed3ff;animation:jq 3.2s steps(1) infinite}
@keyframes jp{0%,100%{transform:translate(-3px,0)}40%{transform:translate(-9px,1px)}43%{transform:translate(-3px,0)}}
@keyframes jq{0%,100%{transform:translate(3px,0)}65%{transform:translate(9px,-1px)}68%{transform:translate(3px,0)}}
.n{font:900 22px 'Arial Black',Impact,'Helvetica Neue',sans-serif;letter-spacing:1px;fill:#f4f4f8}
.d{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#9a9eaa}
.s{font:700 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px}
.live{animation:lv 1.2s ease-in-out infinite}@keyframes lv{50%{opacity:.2}}
.l2{animation-delay:.4s}.l3{animation-delay:.8s}
.bar{animation:fill 3.5s ease-in-out infinite alternate}
@keyframes fill{from{transform:scaleX(.15)}to{transform:scaleX(1)}}
.b1{transform-origin:40px 0}.b2{transform-origin:360px 0;animation-delay:.6s}.b3{transform-origin:680px 0;animation-delay:1.2s}
.sw{animation:sw 4.5s linear infinite}@keyframes sw{from{transform:translateX(-260px)}to{transform:translateX(1260px)}}
.cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="998" height="298" rx="14" fill="#0d0d12" stroke="url(#e)" stroke-width="2"/>
<g clip-path="url(#c)"><rect class="sw" x="0" y="0" width="200" height="300" fill="url(#e)" opacity=".06"/></g>

<g>
<text class="h hp" x="40" y="62" opacity=".85" textLength="270" lengthAdjust="spacingAndGlyphs">NOW BUILDING</text>
<text class="h hq" x="40" y="62" opacity=".85" textLength="270" lengthAdjust="spacingAndGlyphs">NOW BUILDING</text>
<text class="h" x="40" y="62" textLength="270" lengthAdjust="spacingAndGlyphs">NOW BUILDING</text>
<rect class="cur" x="330" y="38" width="12" height="26" fill="#ff3ea5"/>
</g>

<!-- card 1 -->
<rect x="40" y="96" width="280" height="166" rx="12" fill="#14141c" stroke="#ff3ea5" stroke-opacity=".55"/>
<circle class="live" cx="64" cy="124" r="6" fill="#ff3ea5"/>
<text class="s" x="80" y="128" fill="#ff3ea5">IN PROGRESS</text>
<text class="n" x="60" y="166">PUMP DECK</text>
<text class="d" x="60" y="192">non-custodial pump.fun</text>
<text class="d" x="60" y="212">coin launchpad · solana</text>
<rect x="60" y="234" width="240" height="6" rx="3" fill="#24242e"/>
<rect class="bar b1" x="60" y="234" width="240" height="6" rx="3" fill="#ff3ea5"/>

<!-- card 2 -->
<rect x="360" y="96" width="280" height="166" rx="12" fill="#14141c" stroke="#2ed3ff" stroke-opacity=".55"/>
<circle class="live l2" cx="384" cy="124" r="6" fill="#2ed3ff"/>
<text class="s" x="400" y="128" fill="#2ed3ff">IN PROGRESS</text>
<text class="n" x="380" y="166">PFBSFILTER</text>
<text class="d" x="380" y="192">pump.fun chat noise +</text>
<text class="d" x="380" y="212">bad-actor filter</text>
<rect x="380" y="234" width="240" height="6" rx="3" fill="#24242e"/>
<rect class="bar b2" x="380" y="234" width="240" height="6" rx="3" fill="#2ed3ff"/>

<!-- card 3 -->
<rect x="680" y="96" width="280" height="166" rx="12" fill="#14141c" stroke="#b48cff" stroke-opacity=".55"/>
<circle class="live l3" cx="704" cy="124" r="6" fill="#b48cff"/>
<text class="s" x="720" y="128" fill="#b48cff">IN PROGRESS</text>
<text class="n" x="700" y="166">MUSE PARK</text>
<text class="d" x="700" y="192">prediction market where</text>
<text class="d" x="700" y="212">AI agents are the players</text>
<rect x="700" y="234" width="240" height="6" rx="3" fill="#24242e"/>
<rect class="bar b3" x="700" y="234" width="240" height="6" rx="3" fill="#b48cff"/>

<rect x="2" y="2" width="996" height="296" rx="13" fill="url(#sc)"/>
</svg>
