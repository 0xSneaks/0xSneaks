<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="gm anon. shipping in public from NY.">
<defs>
<linearGradient id="e" x1="0" x2="1"><stop offset="0" stop-color="#ff3ea5"/><stop offset=".5" stop-color="#b48cff"/><stop offset="1" stop-color="#2ed3ff"/></linearGradient>
<pattern id="sc" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".045"/></pattern>
</defs>
<style>
.big{font:900 84px 'Arial Black',Impact,'Helvetica Neue',sans-serif;letter-spacing:6px}
.sub{font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b8f9a;letter-spacing:3px}
.p{fill:#ff3ea5;animation:jp 2.3s steps(1) infinite}.q{fill:#2ed3ff;animation:jq 2.9s steps(1) infinite}.k{fill:#f4f4f8;animation:jk 3.7s steps(1) infinite}
@keyframes jp{0%,100%{transform:translate(-4px,0)}30%{transform:translate(-12px,2px)}33%{transform:translate(-4px,0)}70%{transform:translate(5px,-2px)}73%{transform:translate(-4px,0)}}
@keyframes jq{0%,100%{transform:translate(4px,0)}45%{transform:translate(13px,-2px)}48%{transform:translate(4px,0)}85%{transform:translate(-6px,2px)}88%{transform:translate(4px,0)}}
@keyframes jk{0%,91%,100%{clip-path:inset(0 0 0 0);transform:none}92%{clip-path:inset(40% 0 35% 0);transform:translateX(18px)}94%{clip-path:inset(10% 0 70% 0);transform:translateX(-14px)}96%{clip-path:inset(0 0 0 0);transform:none}}
.drop{animation:dr 5s ease-in-out infinite;transform-origin:880px 0}@keyframes dr{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(42px) rotate(4deg)}}
.drop2{animation:dr2 6.5s ease-in-out infinite .7s;transform-origin:110px 0}@keyframes dr2{0%,100%{transform:translateY(20px) rotate(3deg)}50%{transform:translateY(-6px) rotate(-3deg)}}
.legs{animation:wig .5s steps(2) infinite}@keyframes wig{50%{transform:scaleY(.86)}}
.cur{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}
.sw{animation:sw 3.5s linear infinite}@keyframes sw{from{transform:translateX(-300px)}to{transform:translateX(1300px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="1" y="1" width="998" height="198" rx="14" fill="#0d0d12" stroke="url(#e)" stroke-width="2"/>
<rect class="sw" x="0" y="2" width="160" height="196" fill="url(#e)" opacity=".07"/>
<g text-anchor="middle">
<text class="big p" x="500" y="122" opacity=".9">GM ANON</text>
<text class="big q" x="500" y="122" opacity=".9">GM ANON</text>
<text class="big k" x="500" y="122">GM ANON</text>
<text class="sub" x="500" y="164">SHIPPING IN PUBLIC FROM NY</text>
</g>
<rect class="cur" x="738" y="152" width="9" height="15" fill="#ff3ea5"/>
<g class="drop">
<line x1="880" y1="0" x2="880" y2="58" stroke="#8b8f9a" stroke-width="1.2"/>
<g transform="translate(880 70)">
<g class="legs" stroke="#2ed3ff" stroke-width="2" fill="none" stroke-linecap="round">
<path d="M-6-3l-12-9-6-10M-6 1l-16-3-8-8M-6 4l-15 6-7 9M-5 7l-10 12-3 10"/>
<path d="M6-3l12-9 6-10M6 1l16-3 8-8M6 4l15 6 7 9M5 7l10 12 3 10"/>
</g>
<ellipse cx="0" cy="2" rx="8" ry="11" fill="#14141c" stroke="#ff3ea5" stroke-width="2"/>
<path d="M-7-12l7 4 7-4v8l-7-4-7 4z" fill="#ff3ea5"/>
<circle cx="-3" cy="4" r="1.6" fill="#2ed3ff"/><circle cx="3" cy="4" r="1.6" fill="#2ed3ff"/>
</g>
</g>
<g class="drop2">
<line x1="110" y1="0" x2="110" y2="40" stroke="#8b8f9a" stroke-width="1.2"/>
<g transform="translate(110 50) scale(.75)">
<g class="legs" stroke="#b48cff" stroke-width="2.4" fill="none" stroke-linecap="round">
<path d="M-6-3l-12-9-6-10M-6 1l-16-3-8-8M-6 4l-15 6-7 9M-5 7l-10 12-3 10"/>
<path d="M6-3l12-9 6-10M6 1l16-3 8-8M6 4l15 6 7 9M5 7l10 12 3 10"/>
</g>
<ellipse cx="0" cy="2" rx="8" ry="11" fill="#14141c" stroke="#2ed3ff" stroke-width="2"/>
<circle cx="-3" cy="4" r="1.6" fill="#ff3ea5"/><circle cx="3" cy="4" r="1.6" fill="#ff3ea5"/>
</g>
</g>
<rect x="2" y="2" width="996" height="196" rx="13" fill="url(#sc)"/>
</svg>
