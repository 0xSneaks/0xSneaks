name: neon snake

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-neon.svg?color_snake=#ff3ea5&color_dots=#16161f,#1d4f66,#2ed3ff,#b48cff,#ff3ea5&color_dot_border=#0d0d12
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "update neon snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
